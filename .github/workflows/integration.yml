name: live integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hide-on-close:
    # This label must designate an explicitly prepared interactive Mac with a
    # running current yabai daemon and Accessibility/UI scripting permission.
    runs-on: [self-hosted, macOS, yabai-live-integration]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make integration-hide-on-close
        env:
          YABAI_INTEGRATION_STRICT: "1"
