name: native macOS private API smoke

on:
  workflow_dispatch:
    inputs:
      os_major:
        description: Expected macOS major version on the prepared host
        type: choice
        required: true
        options: ["14", "15", "26", "27"]
      architecture:
        description: Native hardware architecture (Rosetta is not evidence)
        type: choice
        required: true
        options: [arm64, x86_64]

permissions:
  contents: read

concurrency:
  group: private-api-smoke-${{ inputs.os_major }}-${{ inputs.architecture }}
  cancel-in-progress: false

jobs:
  native-smoke:
    # Explicitly prepared, logged-in Macs only; never run untrusted PRs here.
    runs-on: [self-hosted, macOS, "${{ format('yabai-smoke-macos-{0}-{1}', inputs.os_major, inputs.architecture) }}"]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build read-only probe
        run: make private-api-smoke-build
      - name: Validate real WindowServer APIs on the selected native host
        env:
          EXPECTED_OS: ${{ inputs.os_major }}
          EXPECTED_ARCH: ${{ inputs.architecture }}
        run: |
          python3 -B tests/integration/private_api_smoke.py \
            --probe bin/debug/private-api-smoke \
            --expected-os "$EXPECTED_OS" --expected-arch "$EXPECTED_ARCH" \
            --source-revision "$GITHUB_SHA" | tee "$RUNNER_TEMP/yabai-private-api-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
      - name: Preserve redacted evidence in the run summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/yabai-private-api-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"; then
            {
              printf '### Native private-API smoke evidence\n```json\n'
              cat "$RUNNER_TEMP/yabai-private-api-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
              printf '\n```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
