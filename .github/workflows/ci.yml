name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

# Hosted macOS 26 arm64 capacity can be exhausted, in which case GitHub
# cancels the job without starting it. The macOS 27 job then runs the same
# steps. A job that started and failed on macOS 26 is never retried on 27.
jobs:
  macos-offline:
    runs-on: macos-26
    continue-on-error: true
    outputs:
      started: ${{ steps.runner.outputs.started }}
      passed: ${{ steps.result.outputs.passed }}
    steps: &macos-offline-steps
      - name: Record runner acquisition
        id: runner
        run: echo "started=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify macOS 26 or 27 arm64 runner
        run: |
          test "$(uname -m)" = arm64
          os_major=$(sw_vers -productVersion | cut -d. -f1)
          case "$os_major" in
            26|27) echo "Running on macOS $(sw_vers -productVersion) arm64." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "unsupported macOS major version: $os_major" >&2; exit 1 ;;
          esac
      - name: Install pinned documentation generator
        run: |
          gem install --no-document asciidoctor --version 2.0.26
          test "$(asciidoctor --version | awk 'NR == 1 { print $2 }')" = 2.0.26
      - name: Syntax, generated documentation contract, and diff hygiene
        run: |
          make syntax
          make man-contract
          make man-check
          git diff --check
      - name: Static analyzer regression gate
        run: make analyze
      - name: Bounded parser fuzz smoke
        run: make fuzz-smoke
      - name: Offline evidence-gate self-tests
        run: make classifier-corpus-gate native-tab-evidence-gate
      - name: Release-note extraction tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 tests/extract_changelog_test.py
      - name: AX frame request benchmark
        run: make test-benchmark-ax

      - name: WindowServer snapshot benchmark
        run: make test-benchmark-ws-snapshot

      - name: Space inventory filter benchmark
        run: make test-benchmark-space-inventory

      - name: Window query snapshot benchmark
        run: make test-benchmark-window-query

      - name: Startup, menu, and visibility snapshot reuse benchmark
        run: make test-benchmark-snapshot-reuse

      - name: Ordinary behavior and repository fixtures
        run: make test
      - name: Sanitized behavior
        run: |
          make test-asan
          make test-tsan
      - name: Thin architecture behavior
        run: make test-arm64
      - name: Apple Silicon daemon builds
        run: |
          make debug release asan tsan
          for binary in bin/debug/yabai bin/release/yabai; do
            lipo "$binary" -verify_arch arm64
            test "$(lipo -archs "$binary")" = arm64
            test "$(otool -arch arm64 -l "$binary" | awk '$1 == "minos" { print $2 }')" = 26.0
          done
      - name: Offline config and bounded doctor paths
        run: |
          bin/debug/yabai --check-config examples/yabai.jsonc
          doctor_log="$RUNNER_TEMP/yabai-doctor.txt"
          set +e
          bin/debug/yabai --doctor >"$doctor_log" 2>&1
          doctor_status=$?
          set -e
          grep -Eq '^SUMMARY [0-9]+ failure(s)?; doctor made no changes$' "$doctor_log"
          case "$doctor_status" in
            0)
              ! grep -q '^FAIL ' "$doctor_log"
              grep -q '^SUMMARY 0 failures; doctor made no changes$' "$doctor_log"
              ;;
            1)
              test "$(grep -c '^FAIL ' "$doctor_log")" -eq 1
              grep -q '^FAIL accessibility ' "$doctor_log"
              grep -q '^SUMMARY 1 failure; doctor made no changes$' "$doctor_log"
              ;;
            *)
              cat "$doctor_log" >&2
              exit 1
              ;;
          esac
      - name: Working tree remains clean
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - name: Record success
        id: result
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  macos-offline-27:
    needs: macos-offline
    if: ${{ !cancelled() && needs.macos-offline.outputs.started != 'true' }}
    # Preview GitHub-hosted macOS 27 arm64 image; see .github/actionlint.yaml.
    runs-on: xcode-27
    outputs:
      passed: ${{ steps.result.outputs.passed }}
    steps: *macos-offline-steps

  ci-result:
    name: ci result
    needs:
      - macos-offline
      - macos-offline-27
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require one passing macOS run
        env:
          PRIMARY_STARTED: ${{ needs.macos-offline.outputs.started }}
          PRIMARY_PASSED: ${{ needs.macos-offline.outputs.passed }}
          FALLBACK_PASSED: ${{ needs.macos-offline-27.outputs.passed }}
        run: |
          set -euo pipefail
          if [ "$PRIMARY_STARTED" = true ]; then
            test "$PRIMARY_PASSED" = true || { echo "macOS 26 run failed" >&2; exit 1; }
            echo "Passed on the macOS 26 runner." >> "$GITHUB_STEP_SUMMARY"
          else
            test "$FALLBACK_PASSED" = true || { echo "macOS 26 was unavailable and the macOS 27 run did not pass" >&2; exit 1; }
            echo "macOS 26 was unavailable; passed on the macOS 27 runner." >> "$GITHUB_STEP_SUMMARY"
          fi
