name: ci

on:
  push:
    branches:
      - validation/native-tab-macos27-ephemeral-20261027

permissions:
  contents: read

jobs:
  macos-offline:
    runs-on: [self-hosted, macOS, ARM64, yabai-macos27-native-tab-ephemeral-20261027]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify supplemental macOS 27 arm64 runner
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" -eq 27
      - name: Install pinned documentation generator
        run: |
          gem_home="$RUNNER_TEMP/gems"
          gem install --no-document --install-dir "$gem_home" asciidoctor --version 2.0.26
          test "$("$gem_home/bin/asciidoctor" --version | awk 'NR == 1 { print $2 }')" = 2.0.26
          echo "$gem_home/bin" >> "$GITHUB_PATH"
      - name: Syntax, generated documentation contract, and diff hygiene
        run: |
          make syntax
          make man-contract
          make man-check
          git diff --check
      - name: AX frame request benchmark
        run: make test-benchmark-ax

      - name: WindowServer snapshot benchmark
        run: make test-benchmark-ws-snapshot

      - name: Space inventory filter benchmark
        run: make test-benchmark-space-inventory

      - name: Window query snapshot benchmark
        run: make test-benchmark-window-query

      - name: Startup, menu, and visibility snapshot reuse benchmark
        run: make test-benchmark-snapshot-reuse

      - name: Ordinary behavior and repository fixtures
        run: make test
      - name: Sanitized behavior
        run: |
          make test-asan
          make test-tsan
      - name: Thin architecture behavior
        run: |
          make test-arm64
          make test-x86_64
      - name: Universal daemon builds
        run: |
          make debug release asan tsan
          for binary in bin/debug/yabai bin/release/yabai; do
            for arch in arm64 x86_64; do
              lipo "$binary" -verify_arch "$arch"
              test "$(otool -arch "$arch" -l "$binary" | awk '$1 == "minos" { print $2 }')" = 14.0
            done
          done
      - name: Offline config and bounded doctor paths
        run: |
          bin/debug/yabai --check-config examples/yabai.jsonc
          doctor_log="$RUNNER_TEMP/yabai-doctor.txt"
          set +e
          bin/debug/yabai --doctor >"$doctor_log" 2>&1
          doctor_status=$?
          set -e
          grep -Eq '^SUMMARY [0-9]+ failure(s)?; doctor made no changes$' "$doctor_log"
          case "$doctor_status" in
            0)
              ! grep -q '^FAIL ' "$doctor_log"
              grep -q '^SUMMARY 0 failures; doctor made no changes$' "$doctor_log"
              ;;
            1)
              test "$(grep -c '^FAIL ' "$doctor_log")" -eq 1
              grep -q '^FAIL accessibility ' "$doctor_log"
              grep -q '^SUMMARY 1 failure; doctor made no changes$' "$doctor_log"
              ;;
            *)
              cat "$doctor_log" >&2
              exit 1
              ;;
          esac
      - name: Working tree remains clean
        run: test -z "$(git status --porcelain --untracked-files=all)"
